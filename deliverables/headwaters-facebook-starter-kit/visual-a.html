<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --evergreen: #1f3d2e;
    --cream: #f4ede0;
    --rust: #b85a3e;
    --ink: #17211c;
    --muted: #6d8176;
    --gold: #d4a017;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1350px;
    background: var(--evergreen);
    color: var(--cream);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex; flex-direction: column;
    padding: 120px 100px;
    position: relative;
    overflow: hidden;
  }
  /* Decorative background element */
  .bg-shape {
    position: absolute;
    top: -150px; right: -150px;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(184,90,62,0.15);
    pointer-events: none;
  }
  
  .eyebrow {
    font-size: 24px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 40px;
    font-weight: 700;
  }
  .title {
    font-family: 'DM Serif Display', serif;
    font-size: 110px;
    line-height: 1.05;
    margin-bottom: 80px;
    letter-spacing: -0.02em;
  }
  
  .services {
    display: flex;
    flex-direction: column;
    gap: 40px;
    margin-bottom: auto;
  }
  .service-item {
    display: flex;
    align-items: center;
    gap: 30px;
  }
  .service-line {
    width: 60px; height: 4px; background: var(--rust);
  }
  .service-text {
    font-size: 38px;
    font-weight: 600;
    color: rgba(244,237,224,0.9);
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 2px solid rgba(244,237,224,0.2);
    padding-top: 50px;
  }
  .footer-brand {
    font-family: 'DM Serif Display', serif;
    font-size: 42px;
  }
  .footer-sub {
    font-size: 24px;
    color: rgba(244,237,224,0.6);
    letter-spacing: 0.05em;
    margin-top: 10px;
  }
  .footer-url {
    font-size: 32px;
    font-weight: 700;
    color: var(--gold);
  }
</style>
</head>
<body>
  <div class="bg-shape"></div>
  
  <div class="eyebrow">Headwaters Development Services</div>
  
  <div class="title">Turning northern ideas into practical systems.</div>
  
  <div class="services">
    <div class="service-item">
      <div class="service-line"></div>
      <div class="service-text">Project & Funding Readiness</div>
    </div>
    <div class="service-item">
      <div class="service-line"></div>
      <div class="service-text">Organizational Capacity Building</div>
    </div>
    <div class="service-item">
      <div class="service-line"></div>
      <div class="service-text">Practical Digital Systems</div>
    </div>
  </div>
  
  <div class="footer">
    <div>
      <div class="footer-brand">Headwaters</div>
      <div class="footer-sub">Led by Bobbie Parr</div>
    </div>
    <div class="footer-url">ourheadwaters.ca</div>
  </div>
</body>
</html>
