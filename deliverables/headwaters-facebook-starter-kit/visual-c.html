<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
  :root {
    --evergreen: #1f3d2e;
    --cream: #f4ede0;
    --rust: #b85a3e;
    --ink: #17211c;
    --muted: #6d8176;
    --gold: #d4a017;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1350px;
    background: var(--rust);
    color: var(--cream);
    font-family: 'Plus Jakarta Sans', sans-serif;
    display: flex; flex-direction: column;
    padding: 120px 100px;
    position: relative;
    overflow: hidden;
  }
  .bg-shape {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 900px; height: 900px;
    border-radius: 50%;
    border: 2px dashed rgba(244,237,224,0.15);
    pointer-events: none;
  }
  
  .eyebrow {
    font-size: 24px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.8;
    margin-bottom: 40px;
    font-weight: 700;
  }
  .title {
    font-family: 'DM Serif Display', serif;
    font-size: 110px;
    line-height: 1.05;
    margin-bottom: 80px;
    letter-spacing: -0.02em;
    color: white;
  }
  
  .points {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 40px;
    margin-bottom: auto;
  }
  .point-card {
    background: rgba(31,61,46,0.15);
    padding: 40px;
    border-radius: 12px;
    border: 1px solid rgba(244,237,224,0.1);
  }
  .point-icon {
    color: var(--cream);
    font-size: 32px;
    margin-bottom: 20px;
    font-family: 'JetBrains Mono', monospace;
  }
  .point-text {
    font-size: 32px;
    font-weight: 600;
    line-height: 1.3;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    border-top: 2px solid rgba(244,237,224,0.2);
    padding-top: 50px;
  }
  .footer-brand {
    font-family: 'DM Serif Display', serif;
    font-size: 42px;
  }
  .footer-sub {
    font-size: 24px;
    color: rgba(244,237,224,0.6);
    letter-spacing: 0.05em;
    margin-top: 10px;
  }
  .footer-url {
    font-size: 32px;
    font-weight: 700;
    color: var(--evergreen);
  }
</style>
</head>
<body>
  <div class="bg-shape"></div>
  
  <div class="eyebrow">Headwaters Development Services</div>
  
  <div class="title">Community-owned means it still works when the consultant leaves.</div>
  
  <div class="points">
    <div class="point-card">
      <div class="point-icon">[01]</div>
      <div class="point-text">Tools your team actually uses.</div>
    </div>
    <div class="point-card">
      <div class="point-icon">[02]</div>
      <div class="point-text">Plain-language documentation.</div>
    </div>
    <div class="point-card">
      <div class="point-icon">[03]</div>
      <div class="point-text">No expensive vendor lock-in.</div>
    </div>
    <div class="point-card">
      <div class="point-icon">[04]</div>
      <div class="point-text">Real capacity left behind.</div>
    </div>
  </div>
  
  <div class="footer">
    <div>
      <div class="footer-brand">Headwaters</div>
      <div class="footer-sub">Led by Bobbie Parr</div>
    </div>
    <div class="footer-url">ourheadwaters.ca</div>
  </div>
</body>
</html>
