  # ── Sandbox — village board ──────────────────────────────────────────────

  /api/sandbox/households:
    post:
      operationId: sandboxCreateHousehold
      tags: [sandbox]
      summary: Create a new household (invite-only; bootstrap exemption for first household)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, passphrase]
              properties:
                name: { type: string, maxLength: 80 }
                passphrase: { type: string, minLength: 4 }
                inviteCode: { type: string, description: Required for all households after the first }
      responses:
        '201':
          description: Household created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxAuthResult' }
        '403': { description: Missing or invalid invite code }
        '409': { description: Household name already taken }
    get:
      operationId: sandboxListHouseholds
      tags: [sandbox]
      summary: List all households (organizer only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All households
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SandboxHousehold' }
        '403': { description: Organizer access required }

  /api/sandbox/sessions:
    post:
      operationId: sandboxLogin
      tags: [sandbox]
      summary: Sign in as an existing household
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, passphrase]
              properties:
                name: { type: string }
                passphrase: { type: string }
      responses:
        '200':
          description: Session token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxAuthResult' }
        '401': { description: Incorrect name or passphrase }

  /api/sandbox/me:
    get:
      operationId: sandboxGetMe
      tags: [sandbox]
      summary: Return the currently authenticated household
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current household
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxHousehold' }
        '401': { description: Unauthorized }

  /api/sandbox/invites:
    get:
      operationId: sandboxListInvites
      tags: [sandbox]
      summary: List all invite codes (organizer only)
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Invite list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SandboxInvite' }
    post:
      operationId: sandboxCreateInvite
      tags: [sandbox]
      summary: Generate a new one-time invite code (organizer only)
      security: [{ bearerAuth: [] }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string, maxLength: 100, description: Optional label e.g. "For the Walsh family" }
      responses:
        '201':
          description: Created invite
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxInvite' }

  /api/sandbox/invites/{id}:
    delete:
      operationId: sandboxRevokeInvite
      tags: [sandbox]
      summary: Revoke an unused invite code (organizer only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Revoked }
        '400': { description: Invite already used }
        '404': { description: Invite not found }

  /api/sandbox/buckets:
    get:
      operationId: sandboxListBuckets
      tags: [sandbox]
      summary: List all post buckets
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Buckets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SandboxBucket' }
    post:
      operationId: sandboxCreateBucket
      tags: [sandbox]
      summary: Create a custom post bucket (organizer only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [label]
              properties:
                label: { type: string, maxLength: 50 }
      responses:
        '201':
          description: Created bucket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxBucket' }

  /api/sandbox/buckets/{id}:
    patch:
      operationId: sandboxUpdateBucket
      tags: [sandbox]
      summary: Update a bucket label or Gather Round prompt text (organizer only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                label: { type: string, maxLength: 50 }
                promptText: { type: string, maxLength: 1000, nullable: true, description: Monthly prompt for the gather_round bucket }
      responses:
        '200':
          description: Updated bucket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxBucket' }

  /api/sandbox/posts:
    get:
      operationId: sandboxListPosts
      tags: [sandbox]
      summary: List posts (optionally filtered by bucketId); expired Heads Up posts are purged on read
      security: [{ bearerAuth: [] }]
      parameters:
        - name: bucketId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Posts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SandboxPost' }
    post:
      operationId: sandboxCreatePost
      tags: [sandbox]
      summary: Create a post; Heads Up posts auto-expire after 72 h
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bucketId, body]
              properties:
                bucketId: { type: string, format: uuid }
                body: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Created post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxPost' }

  /api/sandbox/posts/{id}:
    delete:
      operationId: sandboxDeletePost
      tags: [sandbox]
      summary: Delete a post (own post or organizer)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }
        '403': { description: Cannot delete another household's post }

  /api/sandbox/roles:
    get:
      operationId: sandboxListRoles
      tags: [sandbox]
      summary: |
        List community standby roles.
        Organizers see all. Members see public roles (with full household identity for the standby reference card)
        and their own private assignments. Other households' private roles are hidden.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SandboxRole' }
    post:
      operationId: sandboxCreateRole
      tags: [sandbox]
      summary: Create a community role (organizer only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [roleName]
              properties:
                roleName: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 500 }
      responses:
        '201':
          description: Created role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxRole' }

  /api/sandbox/roles/{id}:
    patch:
      operationId: sandboxUpdateRole
      tags: [sandbox]
      summary: Update a role — assign household, toggle public visibility (organizer only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleName: { type: string, maxLength: 100 }
                description: { type: string, maxLength: 500 }
                householdId: { type: string, format: uuid, nullable: true }
                isPublic: { type: boolean }
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxRole' }
    delete:
      operationId: sandboxDeleteRole
      tags: [sandbox]
      summary: Delete a community role (organizer only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Deleted }

  /api/sandbox/standby/active:
    get:
      operationId: sandboxGetActiveStandby
      tags: [sandbox]
      summary: Return the current active standby event, or null
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Active event or null
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SandboxStandbyEvent'
                  - type: 'null'

  /api/sandbox/standby:
    post:
      operationId: sandboxDeclareStandby
      tags: [sandbox]
      summary: Declare a neighbourhood standby event (organizer only)
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Declared event
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SandboxStandbyEvent' }

  /api/sandbox/standby/{id}/end:
    post:
      operationId: sandboxEndStandby
      tags: [sandbox]
      summary: End an active standby event (organizer only)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Event ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  isActive: { type: boolean }

  /api/sandbox/checkins:
    get:
      operationId: sandboxGetCheckins
      tags: [sandbox]
      summary: |
        Checkin summary for the active standby event.
        All members see counts and who checked in.
        Organizer additionally receives the list of household IDs that have NOT yet checked in.
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Checkin summary or null when no active event
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/SandboxCheckinSummary'
                  - type: 'null'
    post:
      operationId: sandboxCheckin
      tags: [sandbox]
      summary: Mark the authenticated household as safe/present
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        '400': { description: No active standby event }

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    # ── Sandbox schemas ──────────────────────────────────────────────────────
    SandboxHousehold:
      type: object
      required: [id, name, isOrganizer, gatherRoundParticipated, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        isOrganizer: { type: boolean }
        gatherRoundParticipated: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    SandboxAuthResult:
      type: object
      required: [token, household]
      properties:
        token: { type: string }
        household: { $ref: '#/components/schemas/SandboxHousehold' }
    SandboxInvite:
      type: object
      required: [id, code, note, createdAt, usedAt, usedByHouseholdName]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        note: { type: string }
        createdAt: { type: string, format: date-time }
        usedAt: { type: string, format: date-time, nullable: true }
        usedByHouseholdName: { type: string, nullable: true }
    SandboxBucket:
      type: object
      required: [id, slug, label, isBuiltIn, isHeadsUp, isGatherRound, sortOrder, promptText]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        label: { type: string }
        isBuiltIn: { type: boolean }
        isHeadsUp: { type: boolean }
        isGatherRound: { type: boolean }
        sortOrder: { type: string }
        promptText: { type: string, nullable: true, description: Monthly prompt text for the gather_round bucket }
    SandboxPost:
      type: object
      required: [id, householdId, householdName, bucketId, bucketSlug, body, expiresAt, createdAt]
      properties:
        id: { type: string, format: uuid }
        householdId: { type: string, format: uuid }
        householdName: { type: string }
        bucketId: { type: string, format: uuid }
        bucketSlug: { type: string }
        body: { type: string }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    SandboxRole:
      type: object
      required: [id, roleName, description, householdId, householdName, isPublic, assignedByOrganizer]
      properties:
        id: { type: string, format: uuid }
        roleName: { type: string }
        description: { type: string }
        householdId: { type: string, format: uuid, nullable: true }
        householdName: { type: string, nullable: true, description: Shown for public roles and to the assigned household; null otherwise }
        isPublic: { type: boolean }
        assignedByOrganizer: { type: boolean }
    SandboxStandbyEvent:
      type: object
      required: [id, name, declaredByHouseholdId, declaredByName, isActive, declaredAt, endedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        declaredByHouseholdId: { type: string, format: uuid }
        declaredByName: { type: string }
        isActive: { type: boolean }
        declaredAt: { type: string, format: date-time }
        endedAt: { type: string, format: date-time, nullable: true }
    SandboxCheckinSummary:
      type: object
      required: [eventId, total, checkedIn, myCheckedIn, remaining, checkins]
      properties:
        eventId: { type: string, format: uuid }
        total: { type: integer }
        checkedIn: { type: integer }
        myCheckedIn: { type: boolean }
        remaining:
          type: array
          description: Households that have not yet checked in (organizer-only; empty array for non-organizers)
          items:
            type: object
            required: [id, name]
            properties:
              id: { type: string, format: uuid }
              name: { type: string }
        checkins:
          type: array
          items:
            type: object
            required: [householdId, householdName, checkedInAt]
            properties:
              householdId: { type: string, format: uuid }
              householdName: { type: string }
              checkedInAt: { type: string, format: date-time }
    # ── End sandbox schemas ───────────────────────────────────────────────────
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    AttachmentSignedUrlResponse:
      type: object
      required: [signedUrl, expiresIn]
      properties:
        signedUrl:
          type: string
          format: uri
          description: Short-lived GCS signed download URL (valid for ~5 minutes).
        expiresIn:
          type: integer
          description: Seconds until the URL expires.

    Subject:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
    SubjectWithCount:
      allOf:
        - $ref: '#/components/schemas/Subject'
        - type: object
          required: [entryCount]
          properties:
            entryCount: { type: integer }

    ProjectBucket:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
    ProjectBucketWithCount:
      allOf:
        - $ref: '#/components/schemas/ProjectBucket'
        - type: object
          required: [entryCount]
          properties:
            entryCount: { type: integer }

    Producer:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [producer, distributor, study, organization, other]
          nullable: true
        description: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        screenshotUrl: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        location: { type: string, nullable: true }
        statusFlag:
          type: string
          nullable: true
          description: e.g. "operating", "uncertain", "wound down"
        statusNotes: { type: string, nullable: true }
        substituteForProducerSlug:
          type: string
          nullable: true
          description: e.g. Shumaka Dust substitutes for Crazy Good Spices
        entryCount: { type: integer, default: 0 }
    ProducerDetail:
      allOf:
        - $ref: '#/components/schemas/Producer'
        - type: object
          properties:
            entries:
              type: array
              items:
                $ref: '#/components/schemas/LibraryEntry'

    CreateProducerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string }
        kind:
          type: string
          enum: [producer, distributor, study, organization, other]
        description: { type: string }
        websiteUrl: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        location: { type: string }
        statusFlag: { type: string }
        statusNotes: { type: string }
        substituteForProducerSlug: { type: string }

    Contributor:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        organization: { type: string, nullable: true }
        email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        entryCount: { type: integer, default: 0 }
    CreateContributorRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        organization: { type: string }
        email: { type: string }
        notes: { type: string }

    LibraryEntry:
      type: object
      required: [id, kind, title, status, createdAt, updatedAt, subjects, buckets]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [file, web_source]
        title: { type: string }
        summary: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status:
          type: string
          enum: [published, needs_review]
        sourceUrl: { type: string, nullable: true }
        screenshotUrl: { type: string, nullable: true }
        screenshotObjectPath: { type: string, nullable: true }
        # File-specific
        storageRef:
          type: string
          nullable: true
          description: Object reference. Format `gcs:<path>`, where `<path>` is either `/objects/<id>` (private) or `/public-objects/<path>` (publicly served).
        contentHash: { type: string, nullable: true }
        fileSize: { type: integer, nullable: true }
        contentType: { type: string, nullable: true }
        originalFilename: { type: string, nullable: true }
        fileType:
          type: string
          nullable: true
          description: Coarse type (pdf, image, doc, sheet, text, other)
        # Extracted fields
        contactInfo:
          type: object
          additionalProperties: true
          nullable: true
        prices:
          type: object
          additionalProperties: true
          nullable: true
        dates:
          type: object
          additionalProperties: true
          nullable: true
        geography:
          type: object
          additionalProperties: true
          nullable: true
        statusFlag: { type: string, nullable: true }
        # Relations
        producer:
          allOf:
            - $ref: '#/components/schemas/Producer'
          nullable: true
        contributor:
          allOf:
            - $ref: '#/components/schemas/Contributor'
          nullable: true
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBucket'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LibraryEntryPage:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LibraryEntry'
        total: { type: integer }

    CreateLibraryEntryRequest:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [file, web_source]
        title: { type: string, minLength: 1 }
        summary: { type: string }
        notes: { type: string }
        # File fields
        storageRef: { type: string }
        objectPath:
          type: string
          description: Returned from /storage/uploads/request-url. Server normalizes to a storageRef.
        contentHash: { type: string, description: "SHA-256 hex digest of the file. Used for duplicate detection." }
        fileSize: { type: integer }
        contentType: { type: string }
        originalFilename: { type: string }
        # Web-source fields
        sourceUrl: { type: string }
        screenshotUrl: { type: string }
        # Extracted
        contactInfo:
          type: object
          additionalProperties: true
        prices:
          type: object
          additionalProperties: true
        dates:
          type: object
          additionalProperties: true
        geography:
          type: object
          additionalProperties: true
        statusFlag: { type: string }
        # Relations
        producerId: { type: string, format: uuid }
        producerSlug: { type: string }
        contributorId: { type: string, format: uuid }
        subjectSlugs:
          type: array
          items: { type: string }
        bucketSlugs:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [published, needs_review]

    LibraryEntryUpsertResult:
      type: object
      required: [entry, duplicate]
      properties:
        entry:
          $ref: '#/components/schemas/LibraryEntry'
        duplicate:
          type: boolean
          description: True if a file with the same content hash already existed; the existing entry is returned.

    UpdateLibraryEntryRequest:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        notes: { type: string }
        statusFlag: { type: string }
        contactInfo:
          type: object
          additionalProperties: true
        prices:
          type: object
          additionalProperties: true
        dates:
          type: object
          additionalProperties: true
        geography:
          type: object
          additionalProperties: true
        producerId: { type: string, format: uuid, nullable: true }
        producerSlug: { type: string, nullable: true }
        subjectSlugs:
          type: array
          items: { type: string }
        bucketSlugs:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [published, needs_review]

    CreateEntryFromUrlRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        producerSlug: { type: string }
        subjectSlugs:
          type: array
          items: { type: string }
        bucketSlugs:
          type: array
          items: { type: string }
        notes: { type: string }

    CreateShareLinkRequest:
      type: object
      required: [contributorId]
      properties:
        contributorId: { type: string, format: uuid }
        label: { type: string }
        presetSubjectSlugs:
          type: array
          items: { type: string }
        presetBucketSlugs:
          type: array
          items: { type: string }
        expiresAt: { type: string, format: date-time }

    ShareLink:
      type: object
      required: [id, token, contributor, createdAt]
      properties:
        id: { type: string, format: uuid }
        token: { type: string }
        label: { type: string, nullable: true }
        contributor:
          $ref: '#/components/schemas/Contributor'
        presetSubjects:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
        presetBuckets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBucket'
        url:
          type: string
          description: Full public URL the owner can copy and share.
        uploadCount: { type: integer, default: 0 }
        revokedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }

    ShareLinkSummary:
      allOf:
        - $ref: '#/components/schemas/ShareLink'

    PublicShareLink:
      type: object
      required: [token, contributorName]
      properties:
        token: { type: string }
        label: { type: string, nullable: true }
        contributorName: { type: string }
        ownerLabel:
          type: string
          description: e.g. "Northern Food Systems Research Library"
        presetSubjects:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
        presetBuckets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBucket'

    LibraryStatsCount:
      type: object
      required: [slug, name, count]
      properties:
        slug: { type: string }
        name: { type: string }
        count: { type: integer }
        color: { type: string, nullable: true }

    LibraryStats:
      type: object
      required: [totalEntries, totalProducers, totalSubjects, totalBuckets, needsReviewCount, fileCount, webSourceCount, topSubjects, topProducers, bucketBreakdown]
      properties:
        totalEntries: { type: integer }
        totalProducers: { type: integer }
        totalSubjects: { type: integer }
        totalBuckets: { type: integer }
        needsReviewCount: { type: integer }
        fileCount: { type: integer }
        webSourceCount: { type: integer }
        topSubjects:
          type: array
          items:
            $ref: '#/components/schemas/LibraryStatsCount'
        topProducers:
          type: array
          items:
            $ref: '#/components/schemas/LibraryStatsCount'
        bucketBreakdown:
          type: array
          items:
            $ref: '#/components/schemas/LibraryStatsCount'

