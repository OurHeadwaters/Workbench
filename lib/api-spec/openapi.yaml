    post:
      tags: [wordpile]
      operationId: syncWordpile
      summary: Bootstrap sync — upload local snapshot and receive merged state
      description: |
        Upserts the supplied piles + words for the signed-in user (server is
        the merge winner on conflict — local entries with a newer updatedAt
        replace the server row, otherwise the server row stays). Returns the
        full merged state.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncWordpileRequest'
      responses:
        '200':
          description: Full merged state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordpileSnapshot'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

