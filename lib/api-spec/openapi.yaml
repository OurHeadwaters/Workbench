    post:
      operationId: completeHhTask
      tags: [helping-hands]
      summary: Member marks a claimed task as complete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task marked complete — awaiting admin confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HhTask'

  /helping-hands/tasks/{id}/confirm:
    post:
      operationId: confirmHhTask
      tags: [helping-hands]
      summary: Admin confirms completion and releases escrow payment; awards reliability bonus at milestone
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Payment released — task confirmed; bonusAwarded is set if a milestone was hit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HhConfirmResponse'

  /helping-hands/tasks/{id}/expire:
    post:
      operationId: expireHhTask
      tags: [helping-hands]
      summary: >
        Admin expires a single overdue claimed task — increments the member's
        missed-shift count and sets flaggedForDemotion if the threshold is crossed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task expired and member missed-shift count updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HhTask'
        '409':
          description: Task is not in 'claimed' state or date has not passed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

