          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Task claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HhTask'
        '409':
          description: Task already claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

