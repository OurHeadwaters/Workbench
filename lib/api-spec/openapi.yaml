          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWordpilePileRequest'
      responses:
        '200':
          description: Updated pile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WordpilePile'
    delete:
      tags: [wordpile]
      operationId: deleteWordpilePile
      summary: Delete a pile (and all its words)
      parameters:
        - name: pileId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
