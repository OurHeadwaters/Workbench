openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: library
    description: Northern Food Systems Research Library — entries, producers, subjects, project buckets, contributors, and tokenized share links.
  - name: bookkeeper
    description: Headwaters Books — role-aware ledger, cost-centres, transactions, food-handler submissions, and dashboards.
  - name: helping-hands
    description: Helping Hands — band reserve workforce platform. Tasks, members, tiers, escrow tracking, and earnings history.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object content streamed with correct Content-Type.
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /library/stats:
    get:
      tags: [library]
      operationId: getLibraryStats
      summary: Library overview stats
      description: Counts of entries by status, top subjects, top producers, top buckets, recent activity.
      responses:
        '200':
          description: Library stats.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryStats'

  /library/entries:
    get:
      tags: [library]
      operationId: listLibraryEntries
      summary: List library entries
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: subjectSlug
          schema: { type: string }
          description: Filter by subject slug. Repeat to combine.
        - in: query
          name: producerSlug
          schema: { type: string }
        - in: query
          name: bucketSlug
          schema: { type: string }
        - in: query
          name: contributorId
          schema: { type: string, format: uuid }
        - in: query
          name: status
          schema:
            type: string
            enum: [published, needs_review]
        - in: query
          name: kind
          schema:
            type: string
            enum: [file, web_source]
        - in: query
          name: fileType
          schema:
            type: string
            description: Coarse file type (pdf, image, doc, sheet, text, other)
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
        - in: query
          name: sort
          schema:
            type: string
            enum: [recent, title, producer]
            default: recent
      responses:
        '200':
          description: Entries page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntryPage'
    post:
      tags: [library]
      operationId: createLibraryEntry
      summary: Create or finalize a library entry (after a file upload)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryEntryRequest'
      responses:
        '200':
          description: Created or matched existing entry (on duplicate hash).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntryUpsertResult'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /library/entries/{id}:
    get:
      tags: [library]
      operationId: getLibraryEntry
      summary: Get a library entry by ID
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Entry detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      tags: [library]
      operationId: updateLibraryEntry
      summary: Update an entry (edit summary, retag, approve from review)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLibraryEntryRequest'
      responses:
        '200':
          description: Updated entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [library]
      operationId: deleteLibraryEntry
      summary: Delete an entry
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Deleted.

  /library/entries/from-url:
    post:
      tags: [library]
      operationId: createEntryFromUrl
      summary: Paste a website URL — create a web-source entry with extracted metadata and screenshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEntryFromUrlRequest'
      responses:
        '200':
          description: Created entry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntry'
        '400':
          description: Invalid URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /library/producers:
    get:
      tags: [library]
      operationId: listProducers
      summary: List producers / sources
      parameters:
        - in: query
          name: search
          schema: { type: string }
      responses:
        '200':
          description: Producers list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Producer'
    post:
      tags: [library]
      operationId: createProducer
      summary: Create a producer / source profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProducerRequest'
      responses:
        '200':
          description: Created producer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Producer'

  /library/producers/{slug}:
    get:
      tags: [library]
      operationId: getProducer
      summary: Get producer by slug, with related entries
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Producer detail with entries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProducerDetail'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /library/subjects:
    get:
      tags: [library]
      operationId: listSubjects
      summary: List subject tags with counts
      responses:
        '200':
          description: Subjects list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubjectWithCount'

  /library/buckets:
    get:
      tags: [library]
      operationId: listProjectBuckets
      summary: List project buckets with counts
      responses:
        '200':
          description: Project buckets list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectBucketWithCount'

  /library/contributors:
    get:
      tags: [library]
      operationId: listContributors
      summary: List contributors
      responses:
        '200':
          description: Contributors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Contributor'
    post:
      tags: [library]
      operationId: createContributor
      summary: Create a contributor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContributorRequest'
      responses:
        '200':
          description: Created contributor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contributor'

  /library/share-links:
    get:
      tags: [library]
      operationId: listShareLinks
      summary: List tokenized share links the owner has generated
      responses:
        '200':
          description: Share links.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShareLinkSummary'
    post:
      tags: [library]
      operationId: createShareLink
      summary: Generate a tokenized contributor upload link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShareLinkRequest'
      responses:
        '200':
          description: Created share link.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLink'

  /library/share-links/by-token/{token}:
    get:
      tags: [library]
      operationId: getShareLinkByToken
      summary: Public — resolve a share-link token (contributor lands here)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Public share-link info (no PII beyond contributor display name).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShareLink'
        '404':
          description: Not found or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /library/share-links/by-token/{token}/uploads:
    post:
      tags: [library]
      operationId: submitShareLinkUpload
      summary: Public — submit a file uploaded via share link (lands in needs_review queue)
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLibraryEntryRequest'
      responses:
        '200':
          description: Created entry in needs_review.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryEntryUpsertResult'
        '404':
          description: Not found or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /library/needs-review:
    get:
      tags: [library]
      operationId: listNeedsReview
      summary: List entries waiting for owner review
      responses:
        '200':
          description: Needs-review queue.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryEntry'

  /library/recent:
    get:
      tags: [library]
      operationId: getRecentActivity
      summary: Most recently added or updated entries (for dashboard)
      parameters:
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 50, default: 8 }
      responses:
        '200':
          description: Recent entries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LibraryEntry'

  /bookkeeper/me:
    get:
      tags: [bookkeeper]
      operationId: getBookkeeperMe
      summary: Current authenticated user with role
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookkeeperMe'
        '401':
          description: Not signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /bookkeeper/users:
    get:
      tags: [bookkeeper]
      operationId: listBookkeeperUsers
      summary: List app users with roles (owner only)
      responses:
        '200':
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookkeeperUser'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /bookkeeper/users/{id}:
    patch:
      tags: [bookkeeper]
      operationId: updateBookkeeperUser
      summary: Change a user's role (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBookkeeperUserRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookkeeperUser'

  /bookkeeper/cost-centres:
    get:
      tags: [bookkeeper]
      operationId: listCostCentres
      summary: List cost centres
      responses:
        '200':
          description: Cost centres.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CostCentre'
    post:
      tags: [bookkeeper]
      operationId: createCostCentre
      summary: Create a cost centre (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCostCentreRequest'
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostCentre'

  /bookkeeper/cost-centres/{id}:
    patch:
      tags: [bookkeeper]
      operationId: updateCostCentre
      summary: Update a cost centre (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCostCentreRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CostCentre'

  /bookkeeper/accounts:
    get:
      tags: [bookkeeper]
      operationId: listAccounts
      summary: List chart-of-accounts entries
      parameters:
        - in: query
          name: costCentreCode
          schema: { type: string }
          description: Filter to accounts that belong to a cost-centre group.
      responses:
        '200':
          description: Accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Account'
    post:
      tags: [bookkeeper]
      operationId: createAccount
      summary: Add an account (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountRequest'
      responses:
        '200':
          description: Created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /bookkeeper/accounts/{id}:
    patch:
      tags: [bookkeeper]
      operationId: updateAccount
      summary: Update an account (owner only)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountRequest'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'

  /bookkeeper/transactions:
    get:
      tags: [bookkeeper]
      operationId: listTransactions
      summary: List ledger transactions
      parameters:
        - in: query
          name: costCentreCode
          schema: { type: string }
        - in: query
          name: accountCode
          schema: { type: string }
        - in: query
          name: status
          schema:
            type: string
            enum: [posted, voided]
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - in: query
          name: offset
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: Transactions page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
    post:
      tags: [bookkeeper]
      operationId: createTransaction
      summary: Post a balanced multi-line transaction (bookkeeper, ops_manager, owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '200':
          description: Posted transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '400':
          description: Unbalanced or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /bookkeeper/transactions/{id}:
    get:
      tags: [bookkeeper]
      operationId: getTransaction
      summary: Get a transaction with lines
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Transaction detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /bookkeeper/transactions/{id}/void:
    post:
      tags: [bookkeeper]
      operationId: voidTransaction
      summary: Void a posted transaction by writing a reversing entry (bookkeeper, ops_manager, owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoidTransactionRequest'
      responses:
        '200':
          description: Reversing transaction created; original marked voided.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'

  /bookkeeper/uploads/request-url:
    post:
      tags: [bookkeeper]
      operationId: requestReceiptUploadUrl
      summary: Request a presigned upload URL for a receipt photo (any authenticated bookkeeper user)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: Presigned upload URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /bookkeeper/submissions/{id}/attachments/{attachmentId}/signed-url:
    get:
      tags: [bookkeeper]
      operationId: getAttachmentSignedUrl
      summary: Get a short-lived signed download URL for a receipt attachment
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: attachmentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Signed URL for the attachment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentSignedUrlResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /bookkeeper/submissions:
    get:
      tags: [bookkeeper]
      operationId: listSubmissions
      summary: List food-handler submissions (food_handler sees only own; staff see queue)
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, approved, rejected]
        - in: query
          name: mine
          schema: { type: boolean }
      responses:
        '200':
          description: Submissions list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
    post:
      tags: [bookkeeper]
      operationId: createSubmission
      summary: Submit a receipt or inventory log for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubmissionRequest'
      responses:
        '200':
          description: Created submission.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /bookkeeper/submissions/{id}/approve:
    post:
      tags: [bookkeeper]
      operationId: approveSubmission
      summary: Approve a pending submission and post the resulting transaction (bookkeeper, ops_manager, owner)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveSubmissionRequest'
      responses:
        '200':
          description: Approved with linked transaction.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /bookkeeper/submissions/{id}/reject:
    post:
      tags: [bookkeeper]
      operationId: rejectSubmission
      summary: Reject a pending submission with a reason
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectSubmissionRequest'
      responses:
        '200':
          description: Rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'

  /bookkeeper/handlers/activity:
    get:
      tags: [bookkeeper]
      operationId: getHandlerActivity
      summary: Food-handler reminder/nudge view — last submission per handler
      responses:
        '200':
          description: Handlers with activity stats.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HandlerActivity'

  /bookkeeper/handlers/{id}/nudge:
    post:
      tags: [bookkeeper]
      operationId: nudgeHandler
      summary: Record a reminder nudge to a food handler (logs to audit_log)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NudgeHandlerRequest'
      responses:
        '200':
          description: Nudge recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandlerActivity'

  /bookkeeper/dashboard:
    get:
      tags: [bookkeeper]
      operationId: getBookkeeperDashboard
