components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
        contentType:
          type: string
          minLength: 1
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'

    AttachmentSignedUrlResponse:
      type: object
      required: [signedUrl, expiresIn]
      properties:
        signedUrl:
          type: string
          format: uri
          description: Short-lived GCS signed download URL (valid for ~5 minutes).
        expiresIn:
          type: integer
          description: Seconds until the URL expires.

    Subject:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
    SubjectWithCount:
      allOf:
        - $ref: '#/components/schemas/Subject'
        - type: object
          required: [entryCount]
          properties:
            entryCount: { type: integer }

    ProjectBucket:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        color: { type: string, nullable: true }
    ProjectBucketWithCount:
      allOf:
        - $ref: '#/components/schemas/ProjectBucket'
        - type: object
          required: [entryCount]
          properties:
            entryCount: { type: integer }

    Producer:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        kind:
          type: string
          enum: [producer, distributor, study, organization, other]
          nullable: true
        description: { type: string, nullable: true }
        websiteUrl: { type: string, nullable: true }
        screenshotUrl: { type: string, nullable: true }
        contactEmail: { type: string, nullable: true }
        contactPhone: { type: string, nullable: true }
        location: { type: string, nullable: true }
        statusFlag:
          type: string
          nullable: true
          description: e.g. "operating", "uncertain", "wound down"
        statusNotes: { type: string, nullable: true }
        substituteForProducerSlug:
          type: string
          nullable: true
          description: e.g. Shumaka Dust substitutes for Crazy Good Spices
        entryCount: { type: integer, default: 0 }
    ProducerDetail:
      allOf:
        - $ref: '#/components/schemas/Producer'
        - type: object
          properties:
            entries:
              type: array
              items:
                $ref: '#/components/schemas/LibraryEntry'

    CreateProducerRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        slug: { type: string }
        kind:
          type: string
          enum: [producer, distributor, study, organization, other]
        description: { type: string }
        websiteUrl: { type: string }
        contactEmail: { type: string }
        contactPhone: { type: string }
        location: { type: string }
        statusFlag: { type: string }
        statusNotes: { type: string }
        substituteForProducerSlug: { type: string }

    Contributor:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        organization: { type: string, nullable: true }
        email: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        entryCount: { type: integer, default: 0 }
    CreateContributorRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }
        organization: { type: string }
        email: { type: string }
        notes: { type: string }

    LibraryEntry:
      type: object
      required: [id, kind, title, status, createdAt, updatedAt, subjects, buckets]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [file, web_source]
        title: { type: string }
        summary: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        status:
          type: string
          enum: [published, needs_review]
        sourceUrl: { type: string, nullable: true }
        screenshotUrl: { type: string, nullable: true }
        screenshotObjectPath: { type: string, nullable: true }
        # File-specific
        storageRef:
          type: string
          nullable: true
          description: Object reference. Format `gcs:<path>`, where `<path>` is either `/objects/<id>` (private) or `/public-objects/<path>` (publicly served).
        contentHash: { type: string, nullable: true }
        fileSize: { type: integer, nullable: true }
        contentType: { type: string, nullable: true }
        originalFilename: { type: string, nullable: true }
        fileType:
          type: string
          nullable: true
          description: Coarse type (pdf, image, doc, sheet, text, other)
        # Extracted fields
        contactInfo:
          type: object
          additionalProperties: true
          nullable: true
        prices:
          type: object
          additionalProperties: true
          nullable: true
        dates:
          type: object
          additionalProperties: true
          nullable: true
        geography:
          type: object
          additionalProperties: true
          nullable: true
        statusFlag: { type: string, nullable: true }
        # Relations
        producer:
          allOf:
            - $ref: '#/components/schemas/Producer'
          nullable: true
        contributor:
          allOf:
            - $ref: '#/components/schemas/Contributor'
          nullable: true
        subjects:
          type: array
          items:
            $ref: '#/components/schemas/Subject'
        buckets:
          type: array
          items:
            $ref: '#/components/schemas/ProjectBucket'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    LibraryEntryPage:
      type: object
      required: [entries, total]
      properties:
        entries:
          type: array
          items:
            $ref: '#/components/schemas/LibraryEntry'
        total: { type: integer }

    CreateLibraryEntryRequest:
      type: object
      required: [kind, title]
      properties:
        kind:
          type: string
          enum: [file, web_source]
        title: { type: string, minLength: 1 }
        summary: { type: string }
        notes: { type: string }
        # File fields
        storageRef: { type: string }
        objectPath:
          type: string
          description: Returned from /storage/uploads/request-url. Server normalizes to a storageRef.
        contentHash: { type: string, description: "SHA-256 hex digest of the file. Used for duplicate detection." }
        fileSize: { type: integer }
        contentType: { type: string }
        originalFilename: { type: string }
        # Web-source fields
        sourceUrl: { type: string }
        screenshotUrl: { type: string }
        # Extracted
        contactInfo:
          type: object
          additionalProperties: true
        prices:
          type: object
          additionalProperties: true
        dates:
          type: object
          additionalProperties: true
        geography:
          type: object
          additionalProperties: true
        statusFlag: { type: string }
        # Relations
        producerId: { type: string, format: uuid }
        producerSlug: { type: string }
        contributorId: { type: string, format: uuid }
        subjectSlugs:
          type: array
          items: { type: string }
        bucketSlugs:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [published, needs_review]

    LibraryEntryUpsertResult:
      type: object
      required: [entry, duplicate]
      properties:
        entry:
          $ref: '#/components/schemas/LibraryEntry'
        duplicate:
          type: boolean
          description: True if a file with the same content hash already existed; the existing entry is returned.

    UpdateLibraryEntryRequest:
      type: object
      properties:
        title: { type: string }
        summary: { type: string }
        notes: { type: string }
        statusFlag: { type: string }
        contactInfo:
          type: object
          additionalProperties: true
        prices:
          type: object
          additionalProperties: true
        dates:
          type: object
          additionalProperties: true
        geography:
          type: object
          additionalProperties: true
        producerId: { type: string, format: uuid, nullable: true }
        producerSlug: { type: string, nullable: true }
        subjectSlugs:
          type: array
          items: { type: string }
        bucketSlugs:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [published, needs_review]

    CreateEntryFromUrlRequest:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri }
        producerSlug: { type: string }
        subjectSlugs:
          type: array
          items: { type: string }
        bucketSlugs:
          type: array
