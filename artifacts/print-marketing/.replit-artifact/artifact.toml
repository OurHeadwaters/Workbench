kind = "web"
previewPath = "/print-marketing/"
title = "Headwaters Print Marketing Suite"
version = "1.0.0"
id = "artifacts/print-marketing"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/print-marketing/" ]
localPort = 25703

[services.development]
run = "pnpm --filter @workspace/print-marketing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/print-marketing", "run", "build" ]
publicDir = "artifacts/print-marketing/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25703"
BASE_PATH = "/print-marketing/"
