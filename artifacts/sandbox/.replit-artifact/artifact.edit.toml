kind = "web"
previewPath = "/sandbox/"
title = "Sandbox — Village Board"
version = "1.0.0"
id = "artifacts/sandbox"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/sandbox/" ]
localPort = 8092

[services.development]
run = "PORT=8092 BASE_PATH=/sandbox/ pnpm --filter @workspace/sandbox run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sandbox", "run", "build" ]
publicDir = "artifacts/sandbox/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8092"
BASE_PATH = "/sandbox/"
