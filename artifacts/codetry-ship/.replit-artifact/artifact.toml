kind = "web"
previewPath = "/"
title = "Codetry Ship — Crew Manifest"
version = "1.0.0"
id = "artifacts/codetry-ship"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21384

[services.development]
run = "pnpm --filter @workspace/codetry-ship run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/codetry-ship", "run", "build" ]
publicDir = "artifacts/codetry-ship/dist/public"
serve = "static"

[[services.production.redirects]]
from = "/codetry-ship"
to = "/"
status = 301

[[services.production.redirects]]
from = "/codetry-ship/"
to = "/"
status = 301

[[services.production.redirects]]
from = "/codetry-ship/*"
to = "/:splat"
status = 301

# Clean URL aliases for ourheadwaters.ca suite
[[services.production.redirects]]
from = "/library"
to = "/library/"
status = 301

[[services.production.redirects]]
from = "/guide"
to = "/practitioners-guide-v2/"
status = 301

[[services.production.redirects]]
from = "/guide/"
to = "/practitioners-guide-v2/"
status = 301

[[services.production.redirects]]
from = "/guide/*"
to = "/practitioners-guide-v2/:splat"
status = 301

[[services.production.redirects]]
from = "/handbook"
to = "/codetry-handbook/"
status = 301

[[services.production.redirects]]
from = "/handbook/"
to = "/codetry-handbook/"
status = 301

[[services.production.redirects]]
from = "/handbook/*"
to = "/codetry-handbook/:splat"
status = 301

[[services.production.redirects]]
from = "/books"
to = "/headwaters-books/"
status = 301

[[services.production.redirects]]
from = "/books/"
to = "/headwaters-books/"
status = 301

[[services.production.redirects]]
from = "/books/*"
to = "/headwaters-books/:splat"
status = 301

[[services.production.redirects]]
from = "/print"
to = "/print-marketing/"
status = 301

[[services.production.redirects]]
from = "/print/"
to = "/print-marketing/"
status = 301

[[services.production.redirects]]
from = "/print/*"
to = "/print-marketing/:splat"
status = 301

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21384"
BASE_PATH = "/"
