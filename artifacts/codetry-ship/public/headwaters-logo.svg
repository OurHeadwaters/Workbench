<svg width="640" height="200" viewBox="0 0 640 200" fill="none" xmlns="http://www.w3.org/2000/svg">

  <!-- Sunset disc behind eagle — warm amber, no outer ring -->
  <circle cx="95" cy="63" r="52" fill="#C47A3A"/>

  <!-- Eagle traced from founder's 2011 photo (eagle_13.JPG, NWO frozen lake).
       Eagle group uses a local coordinate system centered at origin,
       then translated to (95,68) — the eagle's body center. -->
  <g transform="translate(95,68)">

    <!-- LEFT WING -->
    <path d="M 0,0
             C -8,-3 -20,-8 -34,-12
             C -42,-15 -50,-17 -53,-16
             C -55,-16 -56,-14 -55,-12
             L -53,-14 L -49,-11 L -53,-8 L -48,-6 L -52,-3 L -47,-1
             C -38,2 -24,5 -11,4
             C -6,3 -2,2 0,3
             Z"
          fill="#1f3d2e"/>

    <!-- RIGHT WING -->
    <path d="M 0,0
             C 8,-4 20,-9 34,-13
             C 42,-16 50,-18 53,-17
             C 55,-17 56,-15 55,-13
             L 53,-15 L 49,-12 L 53,-9 L 48,-7 L 52,-4 L 47,-2
             C 38,1 24,4 11,3
             C 6,2 2,1 0,3
             Z"
          fill="#1f3d2e"/>

    <!-- Body -->
    <ellipse cx="0" cy="3" rx="8" ry="7" fill="#1f3d2e"/>
    <!-- Neck -->
    <ellipse cx="0" cy="-7" rx="5" ry="5.5" fill="#1f3d2e"/>
    <!-- White head -->
    <ellipse cx="1" cy="-13" rx="4.5" ry="5" fill="#EDE9E0"/>
    <!-- Beak -->
    <path d="M 5,-13 L 13,-10 L 5,-7 Z" fill="#C47A3A"/>

    <!-- White fan tail -->
    <path d="M -6,9 C -10,14 -13,21 -15,26 L -6,23 C -4,19 -2,16 0,14 C 2,16 4,19 6,23 L 15,26 C 13,21 10,14 6,9 Z"
          fill="#EDE9E0"/>
    <path d="M 0,10 L 0,24 M -5,10 L -10,24 M 5,10 L 10,24"
          stroke="#1f3d2e" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.35"/>

    <!-- Talons -->
    <path d="M -4,11 L -7,18 M -7,18 L -10,21 M -7,18 L -8,22 M -7,18 L -5,22"
          stroke="#1f3d2e" stroke-width="1.2" stroke-linecap="round" fill="none"/>
    <path d="M 4,11 L 7,18 M 7,18 L 10,21 M 7,18 L 8,22 M 7,18 L 5,22"
          stroke="#1f3d2e" stroke-width="1.2" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Boreal treeline at base -->
  <path d="M 28,176 L 32,163 L 37,173 L 43,158 L 49,167 L 55,153 L 62,165 L 69,150 L 76,162 L 84,147 L 91,159 L 95,144 L 99,159 L 106,147 L 114,162 L 121,150 L 128,165 L 134,153 L 140,167 L 146,158 L 152,173 L 157,163 L 162,176 Z"
        fill="#1f3d2e" opacity="0.20"/>

  <text x="210" y="84" font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif"
        font-size="46" font-weight="600" letter-spacing="3" fill="#1f3d2e">HEADWATERS</text>
  <line x1="210" y1="97" x2="628" y2="97" stroke="#1f3d2e" stroke-width="0.8" opacity="0.22"/>
  <text x="212" y="118" font-family="'JetBrains Mono', 'Menlo', 'Courier New', monospace"
        font-size="11" letter-spacing="3.5" fill="#8B5E30">NORTHWESTERN ONTARIO</text>
  <text x="212" y="152" font-family="'Iowan Old Style', Georgia, serif"
        font-size="15.5" fill="#1f3d2e" opacity="0.5" font-style="italic"
        letter-spacing="0.3">Food systems. Plain language. Open numbers.</text>
</svg>
