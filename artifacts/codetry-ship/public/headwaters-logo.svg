<svg width="640" height="200" viewBox="0 0 640 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="200" fill="none"/>

  <!-- halo circle -->
  <circle cx="100" cy="100" r="68" stroke="#C47A3A" stroke-width="4.5" fill="none" opacity="0.82"/>

  <!-- eagle silhouette -->
  <g transform="translate(100,95)" fill="#2A3D2E">
    <!-- body -->
    <ellipse cx="0" cy="4" rx="11" ry="8"/>
    <!-- white head -->
    <ellipse cx="11" cy="-4" rx="7" ry="6" fill="#EDE9E0"/>
    <!-- beak -->
    <path d="M16,-3 L23,0 L16,2 Z" fill="#C47A3A"/>
    <!-- white tail feathers -->
    <path d="M-10,5 L-26,12 L-26,5 L-16,0 Z" fill="#EDE9E0"/>
    <!-- left wing -->
    <path d="M-2,0 C-20,-24 -56,-32 -70,-20 C-56,-15 -32,-7 -10,4 Z"/>
    <!-- right wing -->
    <path d="M2,0 C20,-24 56,-32 70,-20 C56,-15 32,-7 10,4 Z"/>
    <!-- primary feather splits left -->
    <path d="M-68,-21 L-73,-27 M-62,-24 L-66,-31 M-56,-26 L-59,-33 M-50,-27 L-52,-34" stroke="#2A3D2E" stroke-width="2" stroke-linecap="round"/>
    <!-- primary feather splits right -->
    <path d="M68,-21 L73,-27 M62,-24 L66,-31 M56,-26 L59,-33 M50,-27 L52,-34" stroke="#2A3D2E" stroke-width="2" stroke-linecap="round"/>
    <!-- talons -->
    <path d="M3,11 L1,20 M6,12 L7,21 M9,11 L12,19" stroke="#2A3D2E" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- treeline at base of circle -->
  <path d="M38,148 L44,133 L50,144 L56,126 L63,138 L70,120 L77,134 L84,116 L91,130 L98,112 L105,130 L112,116 L119,134 L126,120 L133,138 L140,126 L146,144 L152,133 L158,148 Z"
    fill="#2A3D2E" opacity="0.22"/>

  <!-- wordmark group -->
  <text
    x="192" y="84"
    font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="600"
    letter-spacing="3"
    fill="#2A3D2E"
  >HEADWATERS</text>

  <line x1="192" y1="97" x2="622" y2="97" stroke="#2A3D2E" stroke-width="0.8" opacity="0.25"/>

  <text
    x="194" y="118"
    font-family="'JetBrains Mono', 'Menlo', 'Courier New', monospace"
    font-size="11"
    letter-spacing="3.5"
    fill="#8B5E30"
  >NORTHWESTERN ONTARIO</text>

  <text
    x="194" y="152"
    font-family="'Iowan Old Style', Georgia, serif"
    font-size="15.5"
    fill="#2A3D2E"
    opacity="0.5"
    font-style="italic"
    letter-spacing="0.3"
  >Food systems. Plain language. Open numbers.</text>
</svg>
