<svg width="640" height="200" viewBox="0 0 640 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="640" height="200" fill="none"/>

  <!--
    Eagle mark — reworked May 2025.
    The community circle is now an open bowl/horizon arc (270°, gap at top).
    The eagle sits at and rises from that gap — gathering rather than targeting.
    Rust arc = warmth/community; Evergreen eagle = strength/land.
  -->

  <!-- Community circle arc: open bowl, 270°, gap at top (90°) -->
  <!-- Center (95, 102), radius 68. Arc endpoints at NW(49,54) and NE(141,54). -->
  <path d="M 46,56 A 68,68 0 1 1 144,56"
        stroke="#C47A3A" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Eagle silhouette — rising from / perching on the community circle -->
  <!-- Left wing: leading edge sweeps out-up to wingtip, trailing edge returns -->
  <path d="M 95,62 C 80,56 60,48 38,40 C 24,35 10,32 4,34 C 14,41 34,47 58,57 C 73,63 87,67 95,69 Z"
        fill="#1f3d2e"/>
  <!-- Right wing: mirror -->
  <path d="M 95,62 C 110,56 130,48 152,40 C 166,35 180,32 186,34 C 176,41 156,47 132,57 C 117,63 103,67 95,69 Z"
        fill="#1f3d2e"/>
  <!-- Body/breast -->
  <ellipse cx="95" cy="68" rx="9" ry="8" fill="#1f3d2e"/>
  <!-- Head/neck -->
  <ellipse cx="95" cy="53" rx="7" ry="8" fill="#1f3d2e"/>
  <!-- White head plumage (bald eagle) -->
  <ellipse cx="96" cy="51" rx="5" ry="5.5" fill="#EDE9E0"/>
  <!-- Beak: Rust accent -->
  <path d="M 101,52 L 110,55 L 101,58 Z" fill="#C47A3A"/>
  <!-- Tail feathers -->
  <path d="M 89,75 L 86,88 M 95,76 L 95,89 M 101,75 L 104,88"
        stroke="#1f3d2e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Left wingtip primary feathers -->
  <path d="M 7,35 L 1,27 M 15,32 L 10,23 M 24,30 L 20,21"
        stroke="#1f3d2e" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- Right wingtip primary feathers -->
  <path d="M 183,35 L 189,27 M 175,32 L 180,23 M 166,30 L 170,21"
        stroke="#1f3d2e" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Subtle treeline at base of arc — grounds the eagle in landscape -->
  <path d="M 28,176 L 32,163 L 37,173 L 43,158 L 49,167 L 55,153 L 62,165 L 69,150 L 76,162 L 84,147 L 91,159 L 95,144 L 99,159 L 106,147 L 114,162 L 121,150 L 128,165 L 134,153 L 140,167 L 146,158 L 152,173 L 157,163 L 162,176 Z"
        fill="#1f3d2e" opacity="0.20"/>

  <!-- Wordmark -->
  <text
    x="210" y="84"
    font-family="'Iowan Old Style', Georgia, 'Times New Roman', serif"
    font-size="46"
    font-weight="600"
    letter-spacing="3"
    fill="#1f3d2e"
  >HEADWATERS</text>

  <line x1="210" y1="97" x2="628" y2="97" stroke="#1f3d2e" stroke-width="0.8" opacity="0.22"/>

  <text
    x="212" y="118"
    font-family="'JetBrains Mono', 'Menlo', 'Courier New', monospace"
    font-size="11"
    letter-spacing="3.5"
    fill="#8B5E30"
  >NORTHWESTERN ONTARIO</text>

  <text
    x="212" y="152"
    font-family="'Iowan Old Style', Georgia, serif"
    font-size="15.5"
    fill="#1f3d2e"
    opacity="0.5"
    font-style="italic"
    letter-spacing="0.3"
  >Food systems. Plain language. Open numbers.</text>
</svg>
