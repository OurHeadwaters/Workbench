kind = "web"
previewPath = "/north-star/"
title = "North Star"
version = "1.0.0"
id = "artifacts/north-star"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/north-star/" ]
localPort = 9000

[services.development]
run = "PORT=9000 BASE_PATH=/north-star/ pnpm --filter @workspace/north-star run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/north-star", "run", "build" ]
publicDir = "artifacts/north-star/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "9000"
BASE_PATH = "/north-star/"
