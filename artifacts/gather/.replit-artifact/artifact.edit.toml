kind = "web"
previewPath = "/gather/"
title = "Saltbox"
version = "1.0.0"
id = "artifacts/gather"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/gather/" ]
localPort = 8099

[services.development]
run = "PORT=8099 BASE_PATH=/gather/ pnpm --filter @workspace/gather run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/gather", "run", "build" ]
publicDir = "artifacts/gather/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "8099"
BASE_PATH = "/gather/"
