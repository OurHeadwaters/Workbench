kind = "slides"
previewPath = "/deer-lake-store-plan/"
title = "Deer Lake Store — Operational Plan"
version = "1.0.0"
id = "artifacts/deer-lake-store-plan"
router = "path"

[[integratedSkills]]
name = "slides"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/deer-lake-store-plan/" ]
localPort = 23500

[services.development]
run = "pnpm --filter @workspace/deer-lake-store-plan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deer-lake-store-plan", "run", "build" ]
publicDir = "artifacts/deer-lake-store-plan/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23500"
BASE_PATH = "/deer-lake-store-plan/"
