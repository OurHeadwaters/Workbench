kind = "web"
previewPath = "/check-in/"
title = "Annual Plan Check-in"
version = "1.0.0"
id = "artifacts/check-in"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/check-in/" ]
localPort = 24089

[services.development]
run = "pnpm --filter @workspace/check-in run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/check-in", "run", "build" ]
publicDir = "artifacts/check-in/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24089"
BASE_PATH = "/check-in/"
