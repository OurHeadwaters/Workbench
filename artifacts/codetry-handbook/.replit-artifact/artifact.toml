kind = "mobile"
previewPath = "/codetry-handbook/"
title = "Headwaters: How a Community Runs Its Own Economy"
version = "1.0.0"
id = "artifacts/codetry-handbook"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
name = "expo"
paths = [ "/codetry-handbook/" ]
localPort = 25432

[services.development]
run = "pnpm --filter @workspace/codetry-handbook run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/codetry-handbook", "run", "build"]

[services.production.run]
args = ["node", "artifacts/codetry-handbook/server/serve.js"]

[services.production.run.env]
PORT = "25432"
BASE_PATH = "/codetry-handbook/"
