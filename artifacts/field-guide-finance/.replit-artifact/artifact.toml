kind = "web"
previewPath = "/headwaters-learning/"
title = "Headwaters Learning"
version = "1.0.0"
id = "artifacts/field-guide-finance"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/headwaters-learning/" ]
localPort = 20510

[services.development]
run = "pnpm --filter @workspace/field-guide-finance run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/field-guide-finance", "run", "build" ]
publicDir = "artifacts/field-guide-finance/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20510"
BASE_PATH = "/headwaters-learning/"
