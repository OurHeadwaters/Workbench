kind = "web"
previewPath = "/nursery/"
title = "Zone 4 Nursery"
version = "1.0.0"

[[services]]
name = "web"
paths = ["/nursery"]

[services.development]
run = "PORT=$PORT BASE_PATH=/nursery/ pnpm --filter @workspace/nursery run dev"

[services.production]

[services.production.build]
args = ["pnpm", "--filter", "@workspace/nursery", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"
