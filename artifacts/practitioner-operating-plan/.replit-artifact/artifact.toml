kind = "web"
previewPath = "/practitioner-operating-plan/"
title = "Practitioner's Operating Plan"
version = "1.0.0"
id = "artifacts/practitioner-operating-plan"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/practitioner-operating-plan/" ]
localPort = 25433

[services.development]
run = "pnpm --filter @workspace/practitioner-operating-plan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/practitioner-operating-plan", "run", "build" ]
publicDir = "artifacts/practitioner-operating-plan/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25433"
BASE_PATH = "/practitioner-operating-plan/"
